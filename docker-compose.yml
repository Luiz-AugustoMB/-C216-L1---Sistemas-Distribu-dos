services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Quem chama a API é o navegador, fora da rede do Compose: por isso
        # localhost e a porta publicada, e não o nome do serviço "backend"
        VITE_API_URL: ${VITE_API_URL:-http://localhost:${API_PORT:-8000}}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - c216-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Porta do host configurável (API_PORT no .env) para evitar conflito com
    # outros serviços; dentro do container a API sempre escuta na 8000
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # Dentro da rede do Compose o banco é o serviço "db", e não localhost;
      # a porta aqui é a interna do container, independente de DB_PORT
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-c216}:${POSTGRES_PASSWORD:-c216}@db:5432/${POSTGRES_DB:-c216}
      # A origem acompanha a porta publicada do frontend
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}}
    depends_on:
      db:
        # As migrations rodam na subida da API, então o banco precisa aceitar conexões
        condition: service_healthy
    # A imagem slim não tem curl; só fica saudável depois das migrations e do uvicorn
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - c216-network

  db:
    image: postgres:16-alpine
    # Os padrões são só para desenvolvimento local; fora daqui, defina no .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-c216}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-c216}
      POSTGRES_DB: ${POSTGRES_DB:-c216}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # $$ adia a expansão para dentro do container, que já tem essas variáveis
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - c216-network

volumes:
  db-data:

networks:
  c216-network:
    driver: bridge
