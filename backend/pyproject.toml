[project]
name = "acervo"
version = "0.1.0"
description = "API do Acervo: empréstimos e fila de reserva de livros técnicos"
authors = [
    {name = "Luiz Augusto Moreira Barbosa",email = "luiz.augustombarbosa@gmail.com"}
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi (>=0.163.1,<0.164.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.5,<0.18.0)"
]
