[project]
name = "acervo"
version = "0.1.0"
description = "API do Acervo: empréstimos e fila de reserva de livros técnicos"
authors = [
    {name = "Luiz Augusto Moreira Barbosa",email = "luiz.augustombarbosa@gmail.com"}
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi (>=0.163.1,<0.164.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.5,<0.18.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deixa o "app" importável nos testes sem instalar o projeto como pacote
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E/F: erros básicos, I: ordem dos imports, UP: sintaxe moderna, B: bugs comuns
select = ["E", "F", "I", "UP", "B"]
