name: CI - Frontend

on:
  push:
    branches: [projeto-final]
    paths:
      - "frontend/**"
      - "Makefile"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "Makefile"
      - ".github/workflows/ci-frontend.yml"

# Um push novo na mesma branch cancela a execução anterior, que já ficou desatualizada
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Biome
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o código
        uses: actions/checkout@v4

      - name: Configura o Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala as dependências
        run: make front-install

      - name: Lint, formatação e imports
        run: make front-check

  test:
    name: Vitest
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o código
        uses: actions/checkout@v4

      - name: Configura o Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala as dependências
        run: make front-install

      - name: Testes
        run: make front-test

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o código
        uses: actions/checkout@v4

      - name: Configura o Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala as dependências
        run: make front-install

      - name: Build de produção
        run: make front-build
