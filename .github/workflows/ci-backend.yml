name: CI - Backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: c216
          POSTGRES_PASSWORD: c216
          POSTGRES_DB: c216
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U c216 -d c216"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://c216:c216@localhost:5432/c216
      TEST_DATABASE_URL: postgresql+psycopg://c216:c216@localhost:5432/c216

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "poetry"
          cache-dependency-path: backend/poetry.lock

      - name: Install dependencies
        run: poetry install --no-root

      - name: Lint
        run: poetry run ruff check .

      - name: Unit tests
        run: poetry run pytest tests/unit -v

      - name: Integration tests (PostgreSQL)
        run: poetry run pytest tests/integration -v

      # Os testes removem as tabelas ao final, então o banco está vazio aqui:
      # valida que as migrations recriam o schema do zero, que ele bate com os
      # modelos ORM (alembic check) e que o downgrade também funciona
      - name: Migrations
        run: |
          poetry run alembic upgrade head
          poetry run alembic check
          poetry run alembic downgrade base
          poetry run alembic upgrade head
